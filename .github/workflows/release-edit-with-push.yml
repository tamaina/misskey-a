name: "Release Manager: sync changelog with PR"

on:
  push:
    branches:
      - develop
    paths:
      - 'CHANGELOG.md'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-manager
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # headが$GITHUB_REF_NAME, baseが$STABLE_BRANCHかつopenのPRを1つ取得
      - name: Get PR
        run: |
          prs=$(gh pr list --head develop --base "$STABLE_BRANCH" --state open --json number)
          count=$(jq 'length' <<< "$prs")
          if [ "$count" -gt 1 ]; then
            echo '::error::More than one develop -> main release PR exists.'
            exit 1
          fi
          echo "pr_number=$(jq -r '.[0].number // empty' <<< "$prs")" >> "$GITHUB_OUTPUT"
        id: get_pr
        env:
          STABLE_BRANCH: main
      - name: Get target version
        if: steps.get_pr.outputs.pr_number != ''
        uses: misskey-dev/release-manager-actions/.github/actions/get-target-version@v2
        id: v
      # CHANGELOG.mdの内容を取得
      - name: Get changelog
        if: steps.get_pr.outputs.pr_number != ''
        uses: misskey-dev/release-manager-actions/.github/actions/get-changelog@v2
        with:
          version: ${{ steps.v.outputs.target_version }}
        id: changelog
      # PRのnotesを更新
      - name: Update PR
        if: steps.get_pr.outputs.pr_number != ''
        run: |
          gh pr edit "$PR_NUMBER" --body "$CHANGELOG"
        env:
          PR_NUMBER: ${{ steps.get_pr.outputs.pr_number }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
