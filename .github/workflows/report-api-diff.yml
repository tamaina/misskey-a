name: Report API Diff

on:
  workflow_run:
    types: [completed]
    workflows:
      - Get api.json from Misskey # get-api-diff.yml

jobs:
  compare-diff:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      pull-requests: write

# api-artifact
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: api-artifact-*
          path: artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check artifacts
        run: ls -lh artifacts/
      - name: Load PR Number
        id: load-pr-num
        run: echo "pr-number=$(cat artifacts/pr_number)" >> "$GITHUB_OUTPUT"

      - name: Arrange json files
        run: |
          jq '.' ./artifacts/api-base.json > ./api-base.json
          jq '.' ./artifacts/api-head.json > ./api-head.json
      - name: Get diff of 2 files
        run: diff -u --label=base --label=head ./api-base.json ./api-head.json | cat > api.json.diff
      - name: Get full diff
        run: diff --label=base --label=head --new-line-format='+%L' --old-line-format='-%L' --unchanged-line-format=' %L' ./api-base.json ./api-head.json | cat > api-full.json.diff
      - name: Upload full diff to Artifact
        id: full-diff
        uses: actions/upload-artifact@v7
        with:
          name: api-artifact
          path: |
            api-full.json.diff
            api.json.diff
            api-base.json
            api-head.json
      - id: out-diff
        name: Build diff Comment
        env:
          DIFF_ARTIFACT_URL: ${{ steps.full-diff.outputs.artifact-url }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const diff = readFileSync('api.json.diff', 'utf8');
          const artifactUrl = process.env.DIFF_ARTIFACT_URL;
          if (!artifactUrl) throw new Error('Full API diff artifact URL is missing');
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const lines = diff.split('\n');
          const added = lines.filter(line => line.startsWith('+') && !line.startsWith('+++')).length;
          const removed = lines.filter(line => line.startsWith('-') && !line.startsWith('---')).length;
          const diffBytes = Buffer.byteLength(diff);
          const previewLimit = 8 * 1024;
          const bodyLimit = 60 * 1024; // Strict UTF-8 byte bound, below GitHub's character limit.
          let body = `このPRによるapi.jsonの差分\n\n${added} 追加行 / ${removed} 削除行 (${diffBytes} bytes)\n\n`;
          if (diff.trim().length === 0) {
            body += '差分はありません。\n\n';
          } else {
            let preview = '';
            let previewBytes = 0;
            for (const character of diff) {
              const bytes = Buffer.byteLength(character);
              if (previewBytes + bytes > previewLimit) break;
              preview += character;
              previewBytes += bytes;
            }
            // Keep untrusted diff text inside its fence, including embedded backtick runs.
            const longestFence = Math.max(2, ...[...preview.matchAll(/`+/g)].map(match => match[0].length));
            const fence = '`'.repeat(longestFence + 1);
            const truncated = preview.length < diff.length;
            if (truncated) body += '大きい差分のため、先頭8 KiBのみ表示します。全文とbase/head JSONはartifactに保存しています。\n\n';
            body += `<details>\n<summary>${truncated ? '差分の先頭（省略あり）' : '差分はこちら'}</summary>\n\n${fence}diff\n${preview}\n${fence}\n</details>\n\n`;
          }
          body += `[Full diff and API JSON artifact](${artifactUrl})\n\n[Workflow Page](${runUrl})\n`;
          if (Buffer.byteLength(body) > bodyLimit) throw new Error('API diff comment exceeded its bound');
          writeFileSync('output.md', body);
          NODE
      - uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ steps.load-pr-num.outputs.pr-number }}
          comment-tag: show_diff
          file-path: ./output.md
      - name: Tell error to PR
        uses: thollander/actions-comment-pull-request@v3
        if: failure() && steps.load-pr-num.outputs.pr-number
        with:
          pr-number: ${{ steps.load-pr-num.outputs.pr-number }}
          comment-tag: show_diff_error
          message: |
            api.jsonの差分作成中にエラーが発生しました。詳細は[Workflowのログ](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})を確認してください。
