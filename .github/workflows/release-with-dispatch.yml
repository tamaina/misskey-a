name: "Release Manager [Dispatch]"

on:
  workflow_dispatch:
    inputs:
      version_increment_type:
        type: choice
        description: 'SEMVER INCREMENT (first 2026 transition always targets 9000.0.0)'
        default: 'patch'
        required: true
        options:
          - 'major'
          - 'minor'
          - 'patch'
      merge:
        type: boolean
        description: 'MERGE RELEASE BRANCH TO MAIN'
        default: false
      start-rc:
        type: boolean
        description: 'Start Release Candidate'
        default: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  get-pr:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.get_pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v7
      # headが$GITHUB_REF_NAME, baseが$STABLE_BRANCHかつopenのPRを1つ取得
      - name: Get PRs
        run: |
          echo "pr_number=$(gh pr list --limit 1 --search "head:$GITHUB_REF_NAME base:$STABLE_BRANCH is:open" --json number  --jq '.[] | .number')" >> $GITHUB_OUTPUT
        id: get_pr
        env:
          STABLE_BRANCH: ${{ vars.STABLE_BRANCH }}

  merge:
    uses: misskey-dev/release-manager-actions/.github/workflows/merge.yml@v2
    needs: get-pr
    if: ${{ needs.get-pr.outputs.pr_number != '' && inputs.merge == true }}
    with:
      pr_number: ${{ needs.get-pr.outputs.pr_number }}
      user: 'github-actions[bot]'
      package_jsons_to_rewrite: ${{ vars.PACKAGE_JSONS_TO_REWRITE }}
      # Text to prepend to the changelog
      # The first line must be `## Unreleased`
      changes_template: |
        ## Unreleased

        ### General
        -

        ### Client
        -

        ### Server
        -

      use_external_app_to_release: true
      indent: ${{ vars.INDENT }}
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  create-prerelease:
    uses: misskey-dev/release-manager-actions/.github/workflows/create-prerelease.yml@v2
    needs: get-pr
    if: ${{ needs.get-pr.outputs.pr_number != '' && inputs.merge != true  }}
    with:
      pr_number: ${{ needs.get-pr.outputs.pr_number }}
      user: 'github-actions[bot]'
      package_jsons_to_rewrite: ${{ vars.PACKAGE_JSONS_TO_REWRITE }}
      use_external_app_to_release: true
      indent: ${{ vars.INDENT }}
      draft_prerelease_channel: beta
      ready_start_prerelease_channel: rc
      prerelease_channel: ${{ inputs.start-rc && 'rc' || '' }}
      reset_number_on_channel_change: true
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  create-target:
    uses: misskey-dev/release-manager-actions/.github/workflows/create-target.yml@v2
    needs: get-pr
    if: ${{ needs.get-pr.outputs.pr_number == '' && inputs.merge != true && inputs.start-rc != true }}
    with:
      user: 'github-actions[bot]'
      # Release Manager appends the channel and .0; return only the SemVer core.
      version_increment_script: |
        const increment = '${{ inputs.version_increment_type }}';
        if (!['major', 'minor', 'patch'].includes(increment)) {
          throw new Error('Expected version_increment_type: major, minor or patch');
        }
        const current = process.env.CURRENT_VERSION;
        const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:alpha|beta|rc)\.(0|[1-9]\d*))?$/.exec(current ?? '');
        if (!match) throw new Error('Invalid current release version');
        const [major, minor, patch] = match.slice(1, 4).map(Number);
        if (!match.slice(1).filter(value => value !== undefined).every(value => Number.isSafeInteger(Number(value)))) {
          throw new Error('Version components must be safe integers');
        }
        // One-time migration from this fork's existing calendar series only.
        // Once Release Manager rewrites package.json, this branch is unreachable.
        if (major === 2026 && minor >= 1 && minor <= 12) return '9000.0.0';
        if (major < 9000) throw new Error('Expected the 2026 calendar series or independent SemVer >= 9000');
        const next = increment === 'major' ? [major + 1, 0, 0]
          : increment === 'minor' ? [major, minor + 1, 0]
          : [major, minor, patch + 1];
        if (!next.every(Number.isSafeInteger)) throw new Error('Version increment exceeds safe integers');
        return next.join('.');
      package_jsons_to_rewrite: ${{ vars.PACKAGE_JSONS_TO_REWRITE }}
      use_external_app_to_release: true
      indent: ${{ vars.INDENT }}
      stable_branch: ${{ vars.STABLE_BRANCH }}
      draft_prerelease_channel: beta
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
