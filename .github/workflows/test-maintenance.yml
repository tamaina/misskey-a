name: Test feature maintenance

on:
  push:
    branches: [main]
    paths:
      - packages/features/**
      - packages/backend/**
      - packages/misskey-js/**
      - pnpm-lock.yaml
      - .github/workflows/test-maintenance.yml
  pull_request:
    paths:
      - packages/features/**
      - packages/backend/**
      - packages/misskey-js/**
      - pnpm-lock.yaml
      - .github/workflows/test-maintenance.yml

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        ports: ['54312:5432']
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports: ['56312:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-pre
      - run: cp .github/misskey/test.yml .config/test.yml
      - run: pnpm --filter 'backend^...' -r build
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter backend lint:features
      - run: pnpm --filter backend test:features
      - run: pnpm --filter backend test --run test/unit/boot/shutdown-handler.ts src/misc/collapsed-queue.test.ts src/daemons/role-cleanup.test.ts src/server/api/streaming-shutdown.test.ts src/server/api/feature-endpoints.test.ts src/server/api/feature-endpoint.test.ts src/server/api/batch-feature-endpoints.test.ts src/server/api/feature-id.test.ts src/server/api/command-metadata.test.ts src/server/api/active-following-readers.test.ts src/server/api/canonical-endpoint-registry.test.ts src/feature-bridge-boundaries.test.ts src/models/repository-factory.test.ts src/core/feature-identity.test.ts src/core/feature-service-providers.test.ts src/core/queue-service.pack-job-data.test.ts src/types.test.ts src/server/api/contract-endpoint.test.ts src/server/api/flash-update-contract.test.ts src/server/api/registry-contracts.test.ts src/server/api/drive-listing-contracts.test.ts src/core/entities/feature-identity.test.ts src/queue/processors/feature-identity.test.ts src/models/feature-identity.test.ts src/models/json-schema/feature-identity.test.ts src/server/api/stream/channels/feature-identity.test.ts test/unit/entities
      - run: pnpm --filter backend test --run test/unit/UserSuspendService.ts test/unit/suspension-consistency.ts
      - run: pnpm --filter backend check-migrations
      - run: pnpm --filter backend test:maintenance
      - run: pnpm --filter frontend... -r build
      - run: pnpm --filter backend test:boot
