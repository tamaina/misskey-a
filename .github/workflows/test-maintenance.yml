name: Test feature maintenance

on:
  push:
    branches: [main]
    paths:
      - packages/features/**
      - packages/backend/**
      - packages/misskey-js/**
      - pnpm-lock.yaml
      - .github/workflows/test-maintenance.yml
      - scripts/check-contract-object-inventory.mjs
      - scripts/lib/contract-object-inventory.mjs
      - scripts/contract-object-inventory.json
      - scripts/test/contract-object-inventory.test.mjs
      - package.json
  pull_request:
    paths:
      - packages/features/**
      - packages/backend/**
      - packages/misskey-js/**
      - pnpm-lock.yaml
      - .github/workflows/test-maintenance.yml
      - scripts/check-contract-object-inventory.mjs
      - scripts/lib/contract-object-inventory.mjs
      - scripts/contract-object-inventory.json
      - scripts/test/contract-object-inventory.test.mjs
      - package.json

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        ports: ['54312:5432']
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports: ['56312:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/test/contract-object-inventory.test.mjs
      - run: pnpm check:contract-object-inventory --base HEAD^
      - run: pnpm build-pre
      - run: cp .github/misskey/test.yml .config/test.yml
      - run: pnpm --filter 'backend^...' -r build
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter backend lint:features
      - run: pnpm --filter backend test:features
      - run: pnpm --filter backend test --run test/unit/boot/shutdown-handler.ts src/misc/collapsed-queue.test.ts src/daemons/role-cleanup.test.ts src/server/api/streaming-shutdown.test.ts src/server/api/feature-endpoints.test.ts src/server/api/batch-feature-endpoints.test.ts src/server/api/command-metadata.test.ts src/server/api/active-following-readers.test.ts src/server/api/canonical-endpoint-registry.test.ts test/unit/composition-maintenance.ts src/models/repository-factory.test.ts src/core/feature-service-providers.test.ts src/core/feature-serializer-factories.test.ts src/core/service-declarations.test.ts src/core/stateless-service-declarations.test.ts src/core/auth-search-service-declarations.test.ts src/core/ranking-service-declarations.test.ts src/core/queue-service.pack-job-data.test.ts src/types.test.ts ../features/notes/test/backend/notes-state-contract.test.ts ../features/notes/test/backend/finite-contracts.test.ts ../features/announcements/test/backend/finite-contracts.test.ts ../features/avatar-decorations/test/backend/finite-contracts.test.ts ../features/channels/test/backend/finite-contracts.test.ts ../features/collections/test/backend/finite-contracts.test.ts ../features/discovery/test/backend/finite-contracts.test.ts ../features/emojis/test/backend/finite-contracts.test.ts ../features/notifications/test/backend/finite-contracts.test.ts ../features/portability/test/backend/finite-contracts.test.ts ../features/preferences/test/backend/finite-contracts.test.ts ../features/statistics/test/backend/finite-contracts.test.ts ../features/auth/test/backend/finite-contracts.test.ts ../features/integrations/test/backend/finite-contracts.test.ts ../features/moderation/test/backend/finite-contracts.test.ts ../features/chat/test/backend/finite-contracts.test.ts ../features/games/test/backend/finite-contracts.test.ts ../features/play/test/backend/finite-contracts.test.ts ../features/drive/test/backend/finite-contracts.test.ts ../features/relationships/test/backend/finite-contracts.test.ts ../features/timelines/test/backend/finite-contracts.test.ts ../features/note-search/test/backend/finite-contracts.test.ts ../features/federation/test/backend/finite-contracts.test.ts ../features/instance/test/backend/finite-contracts.test.ts ../features/operations/test/backend/finite-contracts.test.ts ../features/notes/test/backend/finite-native-remaining.test.ts ../features/pages/test/backend/finite-contracts.test.ts ../features/roles/test/backend/finite-contracts.test.ts ../features/users/test/backend/finite-contracts.test.ts ../features/api/test/backend/finite-input.test.ts src/server/api/flash-update-contract.test.ts src/server/api/chart-contracts.test.ts src/server/api/json-string-pattern.test.ts src/server/api/note-create-contracts.test.ts src/queue/queue-counts.test.ts src/server/api/birthday-contract.test.ts test/unit/entities
      - run: pnpm --filter backend test --run test/unit/UserSuspendService.ts test/unit/suspension-consistency.ts ../features/federation/test/backend/ap-deliver-manager.test.ts ../features/runtime/test/backend/queue-delivery.test.ts test/unit/FlashService.ts test/unit/AnnouncementService.ts test/unit/CustomEmojiService.ts
      - name: Verify canonical and retained inbox signatures
        run: pnpm --filter backend exec vitest --config vitest.config.unit.ts --run --maxWorkers=1 ../features/federation/test/backend/http-signature-wire.test.ts ../features/federation/test/backend/inbox-job-signature.test.ts ../features/federation/test/backend/inbox-key-discovery.test.ts ../features/federation/test/backend/ed-sending-receiver-cache.test.ts
      - run: pnpm --filter backend check-migrations
      - run: pnpm --filter backend test:maintenance
      - run: pnpm --filter frontend... -r build
      - run: pnpm --filter backend test:boot
